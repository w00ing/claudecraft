<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentCraft RTS</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 30% 10%, #1a2637 0%, #090d14 40%, #040507 100%);
        font-family: "Rajdhani", monospace;
        overflow: hidden;
      }

      #app {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        width: 100%;
        height: 100%;
        padding-top: 8px;
        box-sizing: border-box;
      }

      canvas {
        box-shadow: 0 26px 52px rgba(0, 0, 0, 0.55);
        border-radius: 6px;
        border: 1px solid #39465a;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
